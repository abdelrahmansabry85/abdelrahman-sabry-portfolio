    <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.body ? document.body.classList.add('light-mode') : document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('light-mode') });
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) { /* storage unavailable — stay on dark theme */ }
      })();
    </script>
